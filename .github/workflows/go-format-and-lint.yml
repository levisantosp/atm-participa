name: go format and lint
on:
  push:
    branches: ['**']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'justfile'
      - '**/justfile'
      - 'go.work'
  pull_request:
    branches: ['**']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'justfile'
      - '**/justfile'
      - 'go.work'

jobs:
  format-and-lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: true

      - name: setup go
        uses: actions/setup-go@main
        with:
          go-version-file: go.work
          cache-dependency-path: api/go.mod
          cache: true

      - name: setup just
        uses: extractions/setup-just@trunk

      - name: setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: api
          install-only: true

      - name: run go fmt and golangci-lint autofix
        if: github.event_name == 'push'
        run: |
          just fmt
          just lintf

      - name: commit changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: |
            style: run go fmt and golangci-lint autofix

            Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: check formatting
        if: github.event_name == 'pull_request'
        run: |
          just fmt
          git diff --exit-code --stat

      - name: golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: api
