name: go tests

on:
  push:
    paths:
      - 'api/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/go-tests.yml'

  pull_request:
    paths:
      - 'api/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/go-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        command: redis-server --requirepass redis
        options: >-
          --health-cmd "redis-cli -a redis ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@main
        with:
          go-version-file: go.work
          cache-dependency-path: api/go.mod
          cache: true

      - name: create .env.test file
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_URL: ${{ secrets.CLOUDFLARE_R2_URL }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          cp api/.env.example api/.env.test
          {
            echo "CLOUDFLARE_R2_ACCESS_KEY_ID=$CLOUDFLARE_R2_ACCESS_KEY_ID"
            echo "CLOUDFLARE_R2_SECRET_ACCESS_KEY=$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
            echo "CLOUDFLARE_R2_URL=$CLOUDFLARE_R2_URL"
            echo "CLOUDFLARE_R2_BUCKET=$CLOUDFLARE_R2_BUCKET"
          } >> api/.env.test
      - name: run tests
        id: tests
        run: make test
